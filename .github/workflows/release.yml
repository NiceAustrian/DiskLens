name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        id: v
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/DiskLens.App -c Release -r ${{ matrix.rid }} \
            -p:Version=${{ steps.v.outputs.version }} \
            -o out/${{ matrix.rid }}

      - name: Package
        shell: bash
        run: |
          name=DiskLens-${{ steps.v.outputs.version }}-${{ matrix.rid }}
          mkdir -p dist
          cp LICENSE README.md out/${{ matrix.rid }}/
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            (cd out/${{ matrix.rid }} && 7z a -tzip "../../dist/$name.zip" . > /dev/null)
          else
            tar -C out/${{ matrix.rid }} -czf "dist/$name.tar.gz" .
          fi
          (cd dist && sha256sum * > "$name.sha256")

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
